name: Últimos posts del blog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://alejandroalsa.es/feed.xml"
          max_post_count: 5
          template: '<a href="$url">$title</a> · <sub>$date</sub><br>$newline'
          date_format: "dd/mm/yyyy"
          commit_message: "Actualizar últimos posts del blog"
